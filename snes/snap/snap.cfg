# LoROM, 4 banks of 32 KB
MEMORY {
    ZP:   start = $0000,   size = $0100;
    RAM:  start = $0200,   size = $1C00;
    ROM0: start = $008000, size = $8000, fill = yes, fillval = $FF;
    ROM1: start = $018000, size = $8000, fill = yes, fillval = $FF;
    ROM2: start = $028000, size = $8000, fill = yes, fillval = $FF;
    ROM3: start = $038000, size = $8000, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = RAM,  type = bss;
    CODE:     load = ROM0, type = ro;
    RODATA:   load = ROM0, type = ro;
    HEADER:   load = ROM0, type = ro, start = $00FFC0;
    VECTORS:  load = ROM0, type = ro, start = $00FFE0;
    BANK1:    load = ROM1, type = ro;
    BANK2:    load = ROM2, type = ro;
    BANK3:    load = ROM3, type = ro;
}
