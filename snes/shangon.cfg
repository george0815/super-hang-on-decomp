# SA-1 cartridge, 1 MB:
#   $00:8000-$01:FFFF (LoROM)  the S-CPU's code and the hand-written SA-1 code
#   $C1:0000-$C4:FFFF (linear) the compiled game code, 64 KB banks
#   $C5:0000-$C7:FFFF          data: assets, the compiled code's tables
#   $C8:0000-$CF:FFFF          the Genesis ROM itself
# I-RAM at $3000; BW-RAM from $40:0000, 256 KB (bank $40 is the Genesis
# RAM mirror, see inc/mem.inc; the port's own buffers are in $41-$43; the
# upload lists at $41:E000 and $41:F000).
MEMORY {
    ZP:     start = $000000, size = $0100;
    WRAM:   start = $000200, size = $1C00;
    BWRAM:  start = $410000, size = $E000;
    ROM00:  start = $008000, size = $8000, fill = yes, fillval = $FF;
    ROM01:  start = $018000, size = $8000, fill = yes, fillval = $FF;
    CC1:    start = $C10000, size = $10000, fill = yes, fillval = $FF;
    CC2:    start = $C20000, size = $10000, fill = yes, fillval = $FF;
    CC3:    start = $C30000, size = $10000, fill = yes, fillval = $FF;
    CC4:    start = $C40000, size = $10000, fill = yes, fillval = $FF;
    DATA:   start = $C50000, size = $30000, fill = yes, fillval = $FF;
    MDROM:  start = $C80000, size = $80000, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    BSS:      load = WRAM,  type = bss;
    BWRAM:    load = BWRAM, type = bss;
    CBSS:     load = BWRAM, type = bss;
    CODE:     load = ROM00, type = ro;
    RODATA:   load = ROM00, type = ro;
    HEADER:   load = ROM00, type = ro, start = $00FFC0;
    VECTORS:  load = ROM00, type = ro, start = $00FFE0;
    CODE2:    load = ROM01, type = ro;
    CCODE1:   load = CC1,   type = ro;
    CCODE2:   load = CC2,   type = ro;
    CCODE3:   load = CC3,   type = ro;
    CCODE4:   load = CC4,   type = ro;
    ASSETS:   load = DATA,  type = ro;
    CRODATA:  load = DATA,  type = ro;
    MDROM:    load = MDROM, type = ro;
}
