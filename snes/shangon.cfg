# SA-1 cartridge, 1 MB: the port in banks $00-$0F at $8000-$FFFF (the
# first 512 KB), then the Genesis ROM, read through the linear mapping at
# $C80000. I-RAM at $3000, BW-RAM from $40:0000 (bank $40 is the Genesis
# RAM mirror, see inc/mem.inc; the port's own buffers are in $41).
MEMORY {
    ZP:     start = $000000, size = $0100;
    WRAM:   start = $000200, size = $1C00;
    BWRAM:  start = $410000, size = $F000;
    ROM00:  start = $008000, size = $8000, fill = yes, fillval = $FF;
    ROM01:  start = $018000, size = $8000, fill = yes, fillval = $FF;
    ROM02:  start = $028000, size = $8000, fill = yes, fillval = $FF;
    ROM03:  start = $038000, size = $8000, fill = yes, fillval = $FF;
    ROM04:  start = $048000, size = $8000, fill = yes, fillval = $FF;
    ROM05:  start = $058000, size = $8000, fill = yes, fillval = $FF;
    ROM06:  start = $068000, size = $8000, fill = yes, fillval = $FF;
    ROM07:  start = $078000, size = $8000, fill = yes, fillval = $FF;
    ROM08:  start = $088000, size = $8000, fill = yes, fillval = $FF;
    ROM09:  start = $098000, size = $8000, fill = yes, fillval = $FF;
    ROM0A:  start = $0A8000, size = $8000, fill = yes, fillval = $FF;
    ROM0B:  start = $0B8000, size = $8000, fill = yes, fillval = $FF;
    ROM0C:  start = $0C8000, size = $8000, fill = yes, fillval = $FF;
    ROM0D:  start = $0D8000, size = $8000, fill = yes, fillval = $FF;
    ROM0E:  start = $0E8000, size = $8000, fill = yes, fillval = $FF;
    ROM0F:  start = $0F8000, size = $8000, fill = yes, fillval = $FF;
    MDROM:  start = $C80000, size = $80000, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    BSS:      load = WRAM,  type = bss;
    BWRAM:    load = BWRAM, type = bss;
    CODE:     load = ROM00, type = ro;
    RODATA:   load = ROM00, type = ro;
    HEADER:   load = ROM00, type = ro, start = $00FFC0;
    VECTORS:  load = ROM00, type = ro, start = $00FFE0;
    ASSETS:   load = ROM01, type = ro;
    MDROM:    load = MDROM, type = ro;
}
